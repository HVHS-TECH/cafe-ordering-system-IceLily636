<!DOCTYPE html>
<html>
<head>
<title>Page Title</title>
</head>
<body>
<img src="Images/cafebanner.png" alt="Cafe Banner" style="width:100%; height:auto;">

<!--name and money form-->
<form id="mainForm"onsubmit="return false;">
   <label for="FormName">Name:</label>
<input type="text" id="nameField" name="FormName" required>
<label for="FormMoney">Money:</label>
<input type="number" id="moneyField" name="FormMoney" required>
<input type="submit" onclick="getFormInput()">
</form>

<!--order form-->
<form id="cartForm"onsubmit="return false;">
   <label for="FormName">Add to cart:</label>
<input type="number" id="cartField" name="FormCart" required min="0">
<input type="submit" onclick="getCartFormInput()">
</form>
   <div id="JavaScriptOutput">



  </div>
<button onclick="placeOrder()">Checkout</button>

<script src="script.js"></script>
</body>
</html>
